[pytest]
testpaths = tests
pythonpath = .
# Samma inställningar lokalt och i CI. Täckningen rapporteras bara (vilka
# rader som saknar tester) och fäller aldrig bygget: en procentgräns lockar
# fram tester som bara finns för siffrans skull.
# -n auto: testerna körs parallellt, en process per kärna. Varje test har sin egen databas i minnet.
addopts = -ra --cov=app --cov-report=term-missing -n auto
